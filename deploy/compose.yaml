# EntityNetworks stack: Caddy (TLS + UI) -> API -> PostgreSQL, plus ONE worker.
# Works with `docker compose` and `podman compose`. Run from this directory:
#
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# Only Caddy publishes ports; the API and the database are reachable only on
# the internal network.
name: entitynetworks

x-app: &app
  image: entitynetworks-api:${TAG:-local}
  build: ../backend
  restart: unless-stopped
  environment:
    APP_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+psycopg://entitynet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/entitynet
    COOKIE_SECURE: "true"
    ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    MAX_FILES_PER_DATASET: ${MAX_FILES_PER_DATASET:-10}
  volumes:
    - uploads:/data/uploads

services:
  db:
    image: docker.io/library/postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: entitynet
      POSTGRES_DB: entitynet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "entitynet", "-d", "entitynet"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off: apply database migrations, then exit. api/worker wait for it.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Exactly one worker: it holds a database lock, so a second one exits.
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    stop_grace_period: 2m   # let a running network build finish on shutdown
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: entitynetworks-web:${TAG:-local}
    build: ../frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-510MB}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
