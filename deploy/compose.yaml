# EntityNetworks stack: Caddy (TLS + UI) -> API -> PostgreSQL, plus ONE worker.
# Works with `docker compose` and `podman compose`. Run from this directory:
#
#   cp .env.example .env   # then edit it
#   docker compose up -d --build
#
# Only Caddy publishes ports; the API and the database are reachable only on
# the internal network.
name: entitynetworks

# Servers pull the images CI built and tested (IMAGE_PREFIX=ghcr.io/<owner>/,
# TAG=<commit SHA>); local runs and CI build them (empty prefix).
x-app: &app
  image: ${IMAGE_PREFIX:-}entitynetworks-api:${TAG:-local}
  build:
    context: ../backend
    labels:
      # Links the published image to the repository on GitHub.
      org.opencontainers.image.source: https://github.com/milo80/EntityNetworksWoS
  restart: unless-stopped
  environment:
    APP_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DATABASE_URL: postgresql+psycopg://entitynet:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/entitynet
    COOKIE_SECURE: "true"
    ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
    MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    MAX_FILES_PER_DATASET: ${MAX_FILES_PER_DATASET:-10}
    # Password reset links point here; mail goes out over SMTP (see .env.example).
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://${SITE_ADDRESS:-localhost}}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
    # The chat assistant (Claude API); empty = off (see .env.example).
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-haiku-5-5}
    ASSISTANT_MESSAGES_PER_HOUR: ${ASSISTANT_MESSAGES_PER_HOUR:-30}
  volumes:
    - uploads:/data/uploads

services:
  db:
    image: docker.io/library/postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: entitynet
      POSTGRES_DB: entitynet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "entitynet", "-d", "entitynet"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-off: apply database migrations, then exit. api/worker wait for it.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Exactly one worker: it holds a database lock, so a second one exits.
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true
    stop_grace_period: 2m   # let a running network build finish on shutdown
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: ${IMAGE_PREFIX:-}entitynetworks-web:${TAG:-local}
    build:
      context: ../frontend
      labels:
        org.opencontainers.image.source: https://github.com/milo80/EntityNetworksWoS
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      MAX_REQUEST_BODY: ${MAX_REQUEST_BODY:-510MB}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
