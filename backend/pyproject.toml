[project]
name = "entitynetworks"
version = "0.1.0"
description = "WoS bibliometric entity networks - pipeline and API"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "python-calamine>=0.2",
    "networkx>=3.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.ruff]
extend-exclude = ["alembic/versions"]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["app", "pipeline"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
# No usable stubs: pandas-stubs lags pandas 3, networkx has none upstream.
module = ["pandas", "pandas.*", "networkx", "networkx.*"]
ignore_missing_imports = true
